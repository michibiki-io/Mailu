name: start-linux-multiarch
on:
  push:
    branches:
      - '2024.06'

permissions:
  contents: write
  packages: write

concurrency: ci-multiarch-${{ github.ref }}

jobs:
  derive-variables:
    name: derive upstream release
    runs-on: ${{ vars.ACTIONS_RUNNER || 'ubuntu-latest' }}
    outputs:
      MAILU_VERSION: ${{ steps.version.outputs.mailu_version }}
      PINNED_MAILU_VERSION: ${{ steps.version.outputs.pinned_mailu_version }}
      DOCKER_ORG: ${{ steps.version.outputs.docker_org }}
      BRANCH: ${{ steps.version.outputs.branch }}
      DEPLOY: ${{ steps.version.outputs.deploy }}
      RELEASE: ${{ steps.version.outputs.release }}
      PUBLISH_PINNED: ${{ steps.version.outputs.publish_pinned }}
      UPSTREAM_ADMIN_IMAGE: ${{ steps.version.outputs.upstream_admin_image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Login to GHCR to check existing fixed image tags
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - name: Select the newest upstream release included in this commit
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: python3 scripts/release/upstream_version.py --branch "$RELEASE_BRANCH"

  build-test-deploy:
    needs: derive-variables
    uses: ./.github/workflows/build_test_deploy.yml
    with:
      architecture: 'linux/amd64,linux/arm64/v8'
      mailu_version: ${{ needs.derive-variables.outputs.MAILU_VERSION }}
      pinned_mailu_version: ${{ needs.derive-variables.outputs.PINNED_MAILU_VERSION }}
      docker_org: ${{ needs.derive-variables.outputs.DOCKER_ORG }}
      branch: ${{ needs.derive-variables.outputs.BRANCH }}
      deploy: ${{ needs.derive-variables.outputs.DEPLOY }}
      release: ${{ needs.derive-variables.outputs.RELEASE }}
      publish_pinned: ${{ needs.derive-variables.outputs.PUBLISH_PINNED }}
      upstream_admin_image: ${{ needs.derive-variables.outputs.UPSTREAM_ADMIN_IMAGE }}
    secrets: inherit

  ci-success:
    name: CI-Done
    if: always()
    needs: build-test-deploy
    runs-on: ${{ vars.ACTIONS_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Check build and publication result
        env:
          RESULT: ${{ needs.build-test-deploy.result }}
        run: test "$RESULT" = success
