###############################################
# OPTIONAL secrets (Docker Hub authentication for a higher pull rate limit)
# ${{ secrets.Docker_Login }}
#    Username of docker login for logging in docker for pulling images (higher pull rate limit)
# ${{ secrets.Docker_Password }}
#    Password of docker login for logging in docker for pulling images (higher pull rate limit)
# ${{ secrets.Docker_Login2 }}
#    Second Username of docker login for logging in docker for pulling images (higher pull rate limit)
# ${{ secrets.Docker_Password2 }}
#    Second Password of docker login for logging in docker for pulling images (higher pull rate limit)
################################################

name: build-test-deploy
on:
  workflow_call:
    inputs:
      architecture:
        description: 'The architecture(s) of the images that will be build. linux/amd64, linux/arm64 (or linux/arm64/v8), or a comma-separated combination'
        required: false
        default: 'linux/amd64,linux/arm64/v8'
        type: string
      mailu_version:
        description: 'The main version that is build. E.g. master or x.y.'
        required: true
        type: string
      pinned_mailu_version:
        description: 'The specific version that is build. E.g. commit hash or x.y.z.'
        required: true
        type: string
      docker_org:
        description: 'The docker organisation where the images are pushed to. E.g. ghcr.io/mailu'
        required: true
        type: string
      publish_pinned:
        description: 'Publish the fixed version tag (false preserves an existing release image).'
        default: 'true'
        required: false
        type: string
      upstream_admin_image:
        description: 'Upstream admin image for UI assets; empty uses pinned_mailu_version.'
        default: ''
        required: false
        type: string
      branch:
        description: 'The branch that triggered this workflow.'
        required: true
        type: string
      test:
        description: 'Run the integration tests (requires the complete upstream image set).'
        default: 'false'
        required: false
        type: string
      deploy:
        description: Deploy to container registry. Happens for all branches but staging. Use string true or false.
        default: 'true'
        required: false
        type: string
      release:
        description: Tag and create the github release. Use string true or false.
        default: 'false'
        required: false
        type: string

  workflow_dispatch:
    inputs:
      architecture:
        description: 'The architecture(s) of the images that will be build. linux/amd64, linux/arm64 (or linux/arm64/v8), or a comma-separated combination'
        required: false
        default: 'linux/amd64,linux/arm64/v8'
        type: string
      mailu_version:
        description: 'The main version that is build. E.g. master or x.y.'
        required: true
        type: string
      pinned_mailu_version:
        description: 'The specific version that is build. E.g. commit hash or x.y.z.'
        required: true
        type: string
      docker_org:
        description: 'The docker organisation where the images are pushed to. E.g. ghcr.io/mailu'
        required: true
        default: 'ghcr.io/michibiki-io'
        type: string
      publish_pinned:
        description: 'Publish the fixed version tag (false preserves an existing release image).'
        default: 'true'
        required: false
        type: string
      upstream_admin_image:
        description: 'Upstream admin image for UI assets; empty uses pinned_mailu_version.'
        default: ''
        required: false
        type: string
      branch:
        description: 'The branch that triggered this workflow.'
        required: true
        type: string
      test:
        description: 'Do test or not.'
        default: 'false'
        required: false
        type: string
      deploy:
        description: Deploy to container registry. Happens for all branches but staging. Use string true or false.
        default: 'true'
        required: false
        type: string
      release:
        description: Tag and create the github release. Use string true or false.
        default: 'false'
        required: false
        type: string
# Serialize image publication across push callers and manual dispatches.
# This group must differ from the caller group to avoid a nested workflow deadlock.
concurrency: ci-publish-${{ github.ref }}

permissions:
  contents: read
  packages: write

env:
  HCL_FILE: ./tests/build-ci.hcl
  DOCKER_PREFIX: mailu-
  UPSTREAM_ADMIN_IMAGE: ${{ inputs.upstream_admin_image || format('ghcr.io/mailu/admin:{0}', inputs.pinned_mailu_version) }}

jobs:
# This job calculates what images must be build. It reads the build.hcl file and then outputs all targets (images) in it.
# This is used by the next build job.
  targets:
    name: create targets
    runs-on: ${{ vars.ACTIONS_RUNNER || 'ubuntu-latest' }}
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      images: ${{ steps.targets.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate architectures
        env:
          ARCHITECTURES: ${{ inputs.architecture }}
        run: |
          IFS=, read -ra platforms <<< "$ARCHITECTURES"
          test "${#platforms[@]}" -gt 0
          for platform in "${platforms[@]}"; do
            case "$platform" in
              linux/amd64|linux/arm64|linux/arm64/v8) ;;
              *) echo "Unsupported platform: $platform" >&2; exit 1 ;;
            esac
          done
      - name: Create matrix
        id: targets
        run: |
          plan=$(docker buildx bake -f "$HCL_FILE" --print)
          echo "matrix=$(jq -cr '.group.default.targets' <<< "$plan")" >> "$GITHUB_OUTPUT"
          echo "images=$(jq -cr '[.target[].tags[0] | split("/")[-1] | split(":")[0]]' <<< "$plan")" >> "$GITHUB_OUTPUT"
      - name: Show matrix
        run: |
          echo ${{ steps.targets.outputs.matrix }}

# This job builds the OIDC base image. UI assets are reused from upstream. The build cache is stored in the ghcr.io registry.
  build-base-assets-x64:
    name: x64 - build OIDC base
    needs: targets
    if: contains(inputs.architecture, 'linux/amd64')
    strategy:
      fail-fast: false
      matrix:
        target: ["base"]
    runs-on: ${{ vars.ACTIONS_RUNNER || 'ubuntu-latest' }}
    permissions:
     contents: read
     packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve global variables
        shell: bash
        run: |
          echo "BRANCH=${{ inputs.branch }}" >> $GITHUB_ENV
          echo "MAILU_VERSION=${{ inputs.mailu_version }}" >> $GITHUB_ENV
          echo "PINNED_MAILU_VERSION=${{ inputs.pinned_mailu_version }}" >> $GITHUB_ENV
          echo "DOCKER_ORG=${{ inputs.docker_org }}" >> $GITHUB_ENV
      - uses: crazy-max/ghaction-github-runtime@v3
      - name: Set up Docker Context for Buildx
        id: buildx-context
        run: |
          docker context inspect builders >/dev/null 2>&1 || docker context create builders
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          endpoint: builders
      - name: Helper to convert docker org to lowercase
        id: string
        uses: ASzc/change-string-case-action@v6
        with:
          string: ${{ github.repository_owner }}
      - name: Get uuid
        id: uuid
        run: |
            echo uuid=$RANDOM >> $GITHUB_OUTPUT
      - name: Build docker image with retry
        env:
          DOCKER_ORG: ghcr.io/${{ steps.string.outputs.lowercase }}
          MAILU_VERSION: ${{ env.MAILU_VERSION }}-build-${{ github.run_id }}
          PINNED_MAILU_VERSION: ${{ env.PINNED_MAILU_VERSION }}-build-${{ github.run_id }}
          LABEL_VERSION: ${{ env.MAILU_VERSION }}
          PINNED_LABEL_VERSION: ${{ env.PINNED_MAILU_VERSION }}
          ARCH: 'linux/amd64'
          BUILDER: ${{ steps.uuid.outputs.uuid }}
          DOCKER_LOGIN: ${{ secrets.Docker_Login }}
          DOCKER_PASSW: ${{ secrets.Docker_Password }}
          BUILDX_NO_DEFAULT_ATTESTATIONS: 1
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 90
          retry_wait_seconds: 30
          max_attempts: 3
          shell: bash
          command: |
            set -euo pipefail \
              ; /usr/bin/docker info \
              ; echo "${{ github.token }}" |        docker login --username "${{ github.repository_owner }}" --password-stdin ghcr.io \
              ; if [ -n "$DOCKER_LOGIN" ] && [ -n "$DOCKER_PASSW" ]; then echo "$DOCKER_PASSW" | docker login --username "$DOCKER_LOGIN" --password-stdin; fi \
              ; /usr/bin/docker buildx rm builder-${{ env.BUILDER }} \
              || echo "builder does not exist" \
              ; /usr/bin/docker buildx create --name builder-${{ env.BUILDER }} --driver docker-container --use \
              ; /usr/bin/docker buildx bake --push \
              --file ./tests/build-ci.hcl \
              --set *.cache-from=type=registry,ref=ghcr.io/${{ steps.string.outputs.lowercase }}/${{ env.DOCKER_PREFIX }}${{ matrix.target }}:buildcache \
              --set *.cache-to=type=registry,ref=ghcr.io/${{ steps.string.outputs.lowercase }}/${{ env.DOCKER_PREFIX }}${{ matrix.target }}:buildcache,mode=max \
              ${{ matrix.target }} \
              ; /usr/bin/docker buildx rm builder-${{ env.BUILDER }}
      - name: cleanup docker buildx instance after failure of build step
        if: ${{ failure() }}
        shell: bash
        env:
          BUILDER: ${{ steps.uuid.outputs.uuid }}
        run: |
          /usr/bin/docker buildx rm builder-${{ env.BUILDER }}

# This job builds the OIDC base image. UI assets are reused from upstream. The build cache is stored in the ghcr.io registry.
  build-base-assets-arm:
    name: ARM64 - build OIDC base
    needs: targets
    if: contains(inputs.architecture, 'linux/arm64')
    strategy:
      fail-fast: false
      matrix:
        target: ["base"]
    runs-on: ${{ vars.ACTIONS_RUNNER_ARM64 || 'ubuntu-24.04-arm' }}
    permissions:
     contents: read
     packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify native ARM64 runner
        run: |
          architecture=$(uname -m)
          if [ "$architecture" != aarch64 ]; then
            echo "ARM jobs require an ARM64 runner; got $architecture. Check ACTIONS_RUNNER_ARM64." >&2
            exit 1
          fi
      - name: Retrieve global variables
        shell: bash
        run: |
          echo "BRANCH=${{ inputs.branch }}" >> $GITHUB_ENV
          echo "MAILU_VERSION=${{ inputs.mailu_version }}" >> $GITHUB_ENV
          echo "PINNED_MAILU_VERSION=${{ inputs.pinned_mailu_version }}" >> $GITHUB_ENV
          echo "DOCKER_ORG=${{ inputs.docker_org }}" >> $GITHUB_ENV
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3
      - name: Helper to convert docker org to lowercase
        id: string
        uses: ASzc/change-string-case-action@v6
        with:
          string: ${{ github.repository_owner }}
      #This is to prevent to shared runners from generating the same uuid
      - name: Get unique random number
        id: uuid
        run: |
            echo uuid=$RANDOM >> $GITHUB_OUTPUT
      - name: Build docker image with retry
        env:
          DOCKER_ORG: ghcr.io/${{ steps.string.outputs.lowercase }}
          MAILU_VERSION: ${{ env.MAILU_VERSION }}-build-${{ github.run_id }}-arm
          PINNED_MAILU_VERSION: ${{ env.PINNED_MAILU_VERSION }}-build-${{ github.run_id }}-arm
          LABEL_VERSION: ${{ env.MAILU_VERSION }}
          PINNED_LABEL_VERSION: ${{ env.PINNED_MAILU_VERSION }}
          ARCH: 'linux/arm64/v8'
          BUILDER: ${{ steps.uuid.outputs.uuid }}
          DOCKER_LOGIN2: ${{ secrets.Docker_Login2 }}
          DOCKER_PASSW2: ${{ secrets.Docker_Password2 }}
          BUILDX_NO_DEFAULT_ATTESTATIONS: 1
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 180
          retry_wait_seconds: 30
          max_attempts: 3
          shell: bash
          command: |
            set -euo pipefail \
              ; /usr/bin/docker info \
              ; echo "${{ github.token }}" |        docker login --username "${{ github.repository_owner }}" --password-stdin ghcr.io \
              ; if [ -n "$DOCKER_LOGIN2" ] && [ -n "$DOCKER_PASSW2" ]; then echo "$DOCKER_PASSW2" | docker login --username "$DOCKER_LOGIN2" --password-stdin; fi \
              ; /usr/bin/docker buildx rm builder-${{ env.BUILDER }} \
              || echo "builder does not exist" \
              ; /usr/bin/docker buildx create --name builder-${{ env.BUILDER }} --driver docker-container --use \
              ; /usr/bin/docker buildx bake --push \
              --file ./tests/build-ci.hcl \
              --set *.cache-from=type=registry,ref=ghcr.io/${{ steps.string.outputs.lowercase }}/${{ env.DOCKER_PREFIX }}${{ matrix.target }}:buildcache-arm \
              --set *.cache-to=type=registry,ref=ghcr.io/${{ steps.string.outputs.lowercase }}/${{ env.DOCKER_PREFIX }}${{ matrix.target }}:buildcache-arm,mode=max \
              ${{ matrix.target }} \
              ; /usr/bin/docker buildx rm builder-${{ env.BUILDER }}
      - name: cleanup docker buildx instance after failure of build step
        if: ${{ failure() }}
        shell: bash
        env:
          BUILDER: ${{ steps.uuid.outputs.uuid }}
        run: |
          /usr/bin/docker buildx rm builder-${{ env.BUILDER }}

# This job builds the main images. The build cache is stored in the ghcr.io registry.
  build:
    name: x64 - build
    if: contains(inputs.architecture, 'linux/amd64')
    needs:
      - targets
      - build-base-assets-x64
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.targets.outputs.matrix) }}
    runs-on: ${{ vars.ACTIONS_RUNNER || 'ubuntu-latest' }}
    permissions:
     contents: read
     packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve global variables
        shell: bash
        run: |
          echo "BRANCH=${{ inputs.branch }}" >> $GITHUB_ENV
          echo "MAILU_VERSION=${{ inputs.mailu_version }}" >> $GITHUB_ENV
          echo "PINNED_MAILU_VERSION=${{ inputs.pinned_mailu_version }}" >> $GITHUB_ENV
          echo "DOCKER_ORG=${{ inputs.docker_org }}" >> $GITHUB_ENV
      - uses: crazy-max/ghaction-github-runtime@v3
      - name: Set up Docker Context for Buildx
        id: buildx-context
        run: |
          docker context inspect builders >/dev/null 2>&1 || docker context create builders
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          endpoint: builders
      - name: Helper to convert docker org to lowercase
        id: string
        uses: ASzc/change-string-case-action@v6
        with:
          string: ${{ github.repository_owner }}
      - name: Get uuid
        id: uuid
        run: |
            echo uuid=$RANDOM >> $GITHUB_OUTPUT
      - name: Build docker image with retry
        env:
          DOCKER_ORG: ghcr.io/${{ steps.string.outputs.lowercase }}
          MAILU_VERSION: ${{ env.MAILU_VERSION }}-build-${{ github.run_id }}
          PINNED_MAILU_VERSION: ${{ env.PINNED_MAILU_VERSION }}-build-${{ github.run_id }}
          LABEL_VERSION: ${{ env.MAILU_VERSION }}
          PINNED_LABEL_VERSION: ${{ env.PINNED_MAILU_VERSION }}
          ARCH: 'linux/amd64'
          BUILDER: ${{ steps.uuid.outputs.uuid }}
          DOCKER_LOGIN: ${{ secrets.Docker_Login }}
          DOCKER_PASSW: ${{ secrets.Docker_Password }}
          BUILDX_NO_DEFAULT_ATTESTATIONS: 1
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 90
          retry_wait_seconds: 30
          max_attempts: 3
          shell: bash
          command: |
            set -euo pipefail \
              ; /usr/bin/docker info \
              ; echo "${{ github.token }}" |        docker login --username "${{ github.repository_owner }}" --password-stdin ghcr.io \
              ; if [ -n "$DOCKER_LOGIN" ] && [ -n "$DOCKER_PASSW" ]; then echo "$DOCKER_PASSW" | docker login --username "$DOCKER_LOGIN" --password-stdin; fi \
              ; /usr/bin/docker buildx rm builder-${{ env.BUILDER }} \
              || echo "builder does not exist" \
              ; /usr/bin/docker buildx create --name builder-${{ env.BUILDER }} --driver docker-container --use \
              ; /usr/bin/docker buildx bake --push \
              --file ./tests/build-ci.hcl \
              --set *.cache-from=type=registry,ref=ghcr.io/${{ steps.string.outputs.lowercase }}/${{ env.DOCKER_PREFIX }}${{ matrix.target }}:buildcache \
              --set *.cache-to=type=registry,ref=ghcr.io/${{ steps.string.outputs.lowercase }}/${{ env.DOCKER_PREFIX }}${{ matrix.target }}:buildcache,mode=max \
              ${{ matrix.target }} \
              ; /usr/bin/docker buildx rm builder-${{ env.BUILDER }}
      - name: cleanup docker buildx instance after failure of build step
        if: ${{ failure() }}
        shell: bash
        env:
          BUILDER: ${{ steps.uuid.outputs.uuid }}
        run: |
          /usr/bin/docker buildx rm builder-${{ env.BUILDER }}

# This job builds the main images. The build cache is stored in the ghcr.io registry.
  build-arm:
    name: ARM64 - build
    if: contains(inputs.architecture, 'linux/arm64')
    needs:
      - targets
      - build-base-assets-arm
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.targets.outputs.matrix) }}
    runs-on: ${{ vars.ACTIONS_RUNNER_ARM64 || 'ubuntu-24.04-arm' }}
    permissions:
     contents: read
     packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify native ARM64 runner
        run: |
          architecture=$(uname -m)
          if [ "$architecture" != aarch64 ]; then
            echo "ARM jobs require an ARM64 runner; got $architecture. Check ACTIONS_RUNNER_ARM64." >&2
            exit 1
          fi
      - name: Retrieve global variables
        shell: bash
        run: |
          echo "BRANCH=${{ inputs.branch }}" >> $GITHUB_ENV
          echo "MAILU_VERSION=${{ inputs.mailu_version }}" >> $GITHUB_ENV
          echo "PINNED_MAILU_VERSION=${{ inputs.pinned_mailu_version }}" >> $GITHUB_ENV
          echo "DOCKER_ORG=${{ inputs.docker_org }}" >> $GITHUB_ENV
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3
      - name: Helper to convert docker org to lowercase
        id: string
        uses: ASzc/change-string-case-action@v6
        with:
          string: ${{ github.repository_owner }}
      #This is to prevent to shared runners from generating the same uuid
      - name: Get unique random number
        id: uuid
        run: |
            echo uuid=$RANDOM >> $GITHUB_OUTPUT
      - name: Build docker image with retry
        env:
          DOCKER_ORG: ghcr.io/${{ steps.string.outputs.lowercase }}
          MAILU_VERSION: ${{ env.MAILU_VERSION }}-build-${{ github.run_id }}-arm
          PINNED_MAILU_VERSION: ${{ env.PINNED_MAILU_VERSION }}-build-${{ github.run_id }}-arm
          LABEL_VERSION: ${{ env.MAILU_VERSION }}
          PINNED_LABEL_VERSION: ${{ env.PINNED_MAILU_VERSION }}
          ARCH: 'linux/arm64/v8'
          BUILDER: ${{ steps.uuid.outputs.uuid }}
          DOCKER_LOGIN2: ${{ secrets.Docker_Login2 }}
          DOCKER_PASSW2: ${{ secrets.Docker_Password2 }}
          BUILDX_NO_DEFAULT_ATTESTATIONS: 1
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 180
          retry_wait_seconds: 30
          max_attempts: 3
          shell: bash
          command: |
            set -euo pipefail \
              ; /usr/bin/docker info \
              ; echo "${{ github.token }}" |        docker login --username "${{ github.repository_owner }}" --password-stdin ghcr.io \
              ; if [ -n "$DOCKER_LOGIN2" ] && [ -n "$DOCKER_PASSW2" ]; then echo "$DOCKER_PASSW2" | docker login --username "$DOCKER_LOGIN2" --password-stdin; fi \
              ; /usr/bin/docker buildx rm builder-${{ env.BUILDER }} \
              || echo "builder does not exist" \
              ; /usr/bin/docker buildx create --name builder-${{ env.BUILDER }} --driver docker-container --use \
              ; /usr/bin/docker buildx bake --push \
              --file ./tests/build-ci.hcl \
              --set *.cache-from=type=registry,ref=ghcr.io/${{ steps.string.outputs.lowercase }}/${{ env.DOCKER_PREFIX }}${{ matrix.target }}:buildcache-arm \
              --set *.cache-to=type=registry,ref=ghcr.io/${{ steps.string.outputs.lowercase }}/${{ env.DOCKER_PREFIX }}${{ matrix.target }}:buildcache-arm,mode=max \
              ${{ matrix.target }} \
              ; /usr/bin/docker buildx rm builder-${{ env.BUILDER }}
      - name: cleanup docker buildx instance after failure of build step
        if: ${{ failure() }}
        shell: bash
        env:
          BUILDER: ${{ steps.uuid.outputs.uuid }}
        run: |
          /usr/bin/docker buildx rm builder-${{ env.BUILDER }}

# This job runs all the tests.
  tests:
    name: tests
    if: contains(inputs.architecture, 'linux/amd64') && inputs.test == 'true'
    runs-on: ${{ vars.ACTIONS_RUNNER || 'ubuntu-latest' }}
    permissions:
     contents: read
     packages: read
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        target: ["api", "core", "fetchmail", "filters", "webmail", "webdav"]
        time: ["2"]
        include:
          - target: "filters"
            time: "3"
        exclude:
          - target: "filters"
            time: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve global variables
        shell: bash
        run: |
          echo "BRANCH=${{ inputs.branch }}" >> $GITHUB_ENV
          echo "MAILU_VERSION=${{ inputs.mailu_version }}" >> $GITHUB_ENV
          echo "PINNED_MAILU_VERSION=${{ inputs.pinned_mailu_version }}" >> $GITHUB_ENV
          echo "DOCKER_ORG=${{ inputs.docker_org }}" >> $GITHUB_ENV
      - uses: crazy-max/ghaction-github-runtime@v3
      - name: Set up Docker Context for Buildx
        id: buildx-context
        run: |
          docker context inspect builders >/dev/null 2>&1 || docker context create builders
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Helper to convert docker org to lowercase
        id: string
        uses: ASzc/change-string-case-action@v6
        with:
          string: ${{ github.repository_owner }}
      - name: Install python packages
        run: python3 -m pip install -r tests/requirements.txt
      - name: Copy all certs
        run: sudo -- sh -c 'mkdir -p /mailu && cp -r tests/certs /mailu && chmod 600 /mailu/certs/*'
      - name: Test ${{ matrix.target }}
        run: python tests/compose/test.py ${{ matrix.target }} ${{ matrix.time }}
        env:
          DOCKER_ORG: ghcr.io/${{ steps.string.outputs.lowercase }}
          MAILU_VERSION: ${{ env.MAILU_VERSION }}-build-${{ github.run_id }}
          PINNED_MAILU_VERSION: ${{ env.PINNED_MAILU_VERSION }}-build-${{ github.run_id }}

  deploy:
    name: Deploy images
    # Publish only after every requested architecture has completed successfully.
    if: >-
      always() && !cancelled() && inputs.deploy == 'true' &&
      needs.targets.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
      (!contains(inputs.architecture, 'linux/amd64') || needs.build.result == 'success') &&
      (!contains(inputs.architecture, 'linux/arm64') || needs.build-arm.result == 'success')
    runs-on: ${{ vars.ACTIONS_RUNNER || 'ubuntu-latest' }}
    needs:
      - targets
      - build
      - build-arm
      - tests
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.targets.outputs.images) }}
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve global variables
        shell: bash
        run: |
          echo "BRANCH=${{ inputs.branch }}" >> $GITHUB_ENV
          echo "MAILU_VERSION=${{ inputs.mailu_version }}" >> $GITHUB_ENV
          echo "PINNED_MAILU_VERSION=${{ inputs.pinned_mailu_version }}" >> $GITHUB_ENV
          echo "DOCKER_ORG=${{ inputs.docker_org }}" >> $GITHUB_ENV
      - uses: crazy-max/ghaction-github-runtime@v3
      - name: Set up Docker Context for Buildx
        id: buildx-context
        run: |
          docker context inspect builders >/dev/null 2>&1 || docker context create builders
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          endpoint: builders
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Helper to convert docker org to lowercase
        id: string
        uses: ASzc/change-string-case-action@v6
        with:
          string: ${{ github.repository_owner }}
      - name: Publish requested platforms
        env:
          ARCHITECTURES: ${{ inputs.architecture }}
          DESTINATION: ${{ inputs.docker_org }}/${{ matrix.target }}
          SOURCE: ghcr.io/${{ steps.string.outputs.lowercase }}/${{ matrix.target }}
          VERSION: ${{ inputs.mailu_version }}
          PINNED_VERSION: ${{ inputs.pinned_mailu_version }}
          PUBLISH_PINNED: ${{ inputs.publish_pinned }}
        run: bash scripts/release/publish-images.sh

#This job creates a tagged release. A tag is created for the pinned version x.y.z. The GH release refers to this tag.
  tag-release:
    permissions:
      contents: write
    if: inputs.release == 'true'
    runs-on: ${{ vars.ACTIONS_RUNNER || 'ubuntu-latest' }}
    needs:
      - deploy
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth 0 is required to also retrieve all tags.
          fetch-depth: 0
      - name: Create fork tag and release matching upstream
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.pinned_mailu_version }}
        run: |
          # An imported upstream tag must never masquerade as an OIDC fork release.
          remote_tag=$(git ls-remote --tags origin "refs/tags/$VERSION" "refs/tags/$VERSION^{}")
          if [ -n "$remote_tag" ]; then
            git fetch --no-tags origin "refs/tags/$VERSION"
            test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$GITHUB_SHA" || {
              echo "Tag $VERSION already points to a different commit; refusing to move it" >&2
              exit 1
            }
          else
            git push origin "$GITHUB_SHA:refs/tags/$VERSION"
          fi
          printf 'OIDC fork of [Mailu %s](https://github.com/Mailu/Mailu/releases/tag/%s).\n\nFork commit: `%s`\n\nOnly the admin image is replaced; use upstream %s images for other services.\n' \
            "$VERSION" "$VERSION" "$GITHUB_SHA" "$VERSION" > release_note.md
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$VERSION" --notes-file release_note.md
