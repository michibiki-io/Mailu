name: Validate fork workflows
on:
  pull_request:
    branches:
      - '2024.06'
  push:
    branches:
      - 'feature/**'

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Test release selection and non-publishing image plans
        run: python3 -m unittest discover -s tests/release -v
      - name: Check GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: '1.7.12'
        run: |
          tool_dir=$(mktemp -d)
          trap 'rm -rf "$tool_dir"' EXIT
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          release="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -fsSL "$release/$archive" -o "$tool_dir/$archive"
          curl -fsSL "$release/actionlint_${ACTIONLINT_VERSION}_checksums.txt" -o "$tool_dir/checksums.txt"
          (cd "$tool_dir" && sha256sum --check --ignore-missing checksums.txt)
          tar -xzf "$tool_dir/$archive" -C "$tool_dir" actionlint
          "$tool_dir/actionlint" -shellcheck='' .github/workflows/*.yml

  image-regression:
    name: Image regression (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            machine: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      ARCH: linux/${{ matrix.arch }}
      DOCKER_ORG: mailu-test
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify native runner and exact commit
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Select admin assets from the matching upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/upstream_version.py --branch 2024.06
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build release targets into the local Docker engine
        env:
          UPSTREAM_ADMIN_IMAGE: ${{ steps.upstream.outputs.upstream_admin_image }}
        run: |
          docker buildx bake -f tests/build-ci.hcl --load --progress plain \
            --set admin.contexts.base=target:base
      - name: Test rendered configuration, webmail, OIDC and mail proxy
        run: bash tests/images/smoke.sh

  oidc-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build isolated OIDC test environment
        run: docker build -t mailu-oidc-tests -f tests/oidc/Dockerfile .
      - name: Test real Mailu routes and pinned OIDC library
        run: docker run --rm mailu-oidc-tests
