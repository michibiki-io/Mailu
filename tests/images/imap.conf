# Isolated mailbox backend. The front authenticates users using the real admin.
protocols = imap lmtp
listen = *
log_path = /dev/stderr
ssl = no
disable_plaintext_auth = no
login_trusted_networks = 0.0.0.0/0
mail_location = maildir:~/Maildir
mail_home = /mail/%u
mail_uid = mailu
mail_gid = mailu
postmaster_address = alice@example.org
passdb {
  driver = static
  args = nopassword=y
}
userdb {
  driver = static
  args = uid=mailu gid=mailu home=/mail/%u
}
service lmtp {
  inet_listener lmtp {
    port = 2525
  }
}
